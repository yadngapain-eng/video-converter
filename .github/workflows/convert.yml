name: Convert Video to 9:16

on:
  workflow_dispatch:
    inputs:
      gdrive_link:
        description: '📥 Google Drive Link'
        required: true
        type: string
      release_tag:
        description: '🏷️ Release Tag (contoh: v1)'
        required: true
        default: 'v1'
        type: string
      platform:
        description: '📱 Platform Target (auto-lock quality)'
        required: true
        default: 'universal'
        type: choice
        options:
          - 'universal'
          - 'whatsapp'
          - 'facebook'
          - 'youtube'
          - 'tiktok'
          - 'instagram'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    name: Convert Video

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cache FFmpeg static
      - name: Cache static FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/ffmpeg
            ~/.local/bin/ffprobe
          key: static-ffmpeg-${{ runner.os }}-v6

      - name: Download static FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          echo '⚡ FFmpeg cache MISS - downloading...'
          mkdir -p ~/.local/bin
          cd /tmp
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar xf ffmpeg-release-amd64-static.tar.xz
          mv ffmpeg-*-amd64-static/ffmpeg ~/.local/bin/
          mv ffmpeg-*-amd64-static/ffprobe ~/.local/bin/
          chmod +x ~/.local/bin/ffmpeg ~/.local/bin/ffprobe
          echo '✅ FFmpeg downloaded'

      - name: Use cached FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit == 'true'
        run: echo '✅ FFmpeg cache HIT!'

      - name: Add FFmpeg to PATH
        run: echo '$HOME/.local/bin' >> $GITHUB_PATH

      # Cache Node modules
      - name: Cache Node modules
        id: cache-node
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install Node dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Verify Node modules
        if: steps.cache-node.outputs.cache-hit == 'true'
        run: echo '✅ Node modules cache HIT!'

      # Show platform info
      - name: Show platform info
        run: |
          echo '════════════════════════════════════════'
          echo '📱 PLATFORM: ${{ inputs.platform }}'
          echo '════════════════════════════════════════'
          node -e "const p = require('./scripts/platforms.js'); p.listPlatforms();"

      # Download video
      - name: Download video from Google Drive
        env:
          GDRIVE_LINK: ${{ inputs.gdrive_link }}
        run: node scripts/download.js

      # Convert video dengan auto quality lock
      - name: Convert video (auto quality lock)
        env:
          PLATFORM: ${{ inputs.platform }}
        run: node scripts/convert.js

      # Get output info
      - name: Get output info
        id: output-info
        run: |
          OUTPUT_FILE=$(cat output/info.txt)
          PLATFORM_FILE=$(cat output/platform.txt)
          FILENAME=$(basename "$OUTPUT_FILE")
          SIZE=$(stat -c %s "$OUTPUT_FILE")
          SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
          echo "file_name=$FILENAME" >> $GITHUB_OUTPUT
          echo "file_size=$SIZE_MB" >> $GITHUB_OUTPUT
          echo "platform=$PLATFORM_FILE" >> $GITHUB_OUTPUT

      # Upload ke Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "Video ${{ inputs.platform }} - ${{ inputs.release_tag }}"
          body: |
            ## 🎬 Video Converted — ${{ inputs.platform }}

            **Platform:** ${{ inputs.platform }}
            **Source:** ${{ inputs.gdrive_link }}
            **File Size:** ${{ steps.output-info.outputs.file_size }} MB

            ### Download
            Klik file di bawah untuk download video.
          files: output/*.mp4
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Summary
      - name: Summary
        run: |
          echo "## 🎬 Conversion Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** ${{ inputs.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "**File:** ${{ steps.output-info.outputs.file_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** ${{ steps.output-info.outputs.file_size }} MB" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cache Status:**" >> $GITHUB_STEP_SUMMARY
          echo "- FFmpeg: ${{ steps.cache-ffmpeg.outputs.cache-hit }}" >> $GITHUB_STEP_SUMMARY
          echo "- Node: ${{ steps.cache-node.outputs.cache-hit }}" >> $GITHUB_STEP_SUMMARY