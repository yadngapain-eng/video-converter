name: Convert Video to 9:16 (Universal)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: '🔗 Video URL (YouTube/FB/IG/TikTok/GDrive/dll)'
        required: true
        type: string
      release_tag:
        description: '🏷️ Release Tag (contoh: v1)'
        required: true
        default: 'v1'
        type: string
      platform:
        description: '📱 Platform Target (auto-lock quality)'
        required: true
        default: 'universal'
        type: choice
        options:
          - universal
          - whatsapp
          - facebook
          - youtube
          - tiktok
          - instagram
      style:
        description: '🎨 Style Aesthetic'
        required: true
        default: 'clean-modern'
        type: choice
        options:
          - clean-modern
          - soft-dreamy
          - cinematic-dark
          - vibrant-vivid
          - subtle-aesthetic
          - neon-glow
          - vintage-film
          - pure-mirror
          - dark-elegant
          - bright-pop
      strict_size_check:
        description: '⚠️ Fail kalau melebihi max size?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: convert-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    name: Convert Video
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache static FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/ffmpeg
            ~/.local/bin/ffprobe
          key: static-ffmpeg-${{ runner.os }}-2026-10

      - name: Download static FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          echo '⚡ FFmpeg cache MISS - downloading...'
          mkdir -p ~/.local/bin
          cd /tmp
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar xf ffmpeg-release-amd64-static.tar.xz
          mv ffmpeg-*-amd64-static/ffmpeg ~/.local/bin/
          mv ffmpeg-*-amd64-static/ffprobe ~/.local/bin/
          chmod +x ~/.local/bin/ffmpeg ~/.local/bin/ffprobe
          echo '✅ FFmpeg downloaded'

      - name: Use cached FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit == 'true'
        run: echo '✅ FFmpeg cache HIT!'

      - name: Add FFmpeg to PATH
        run: echo '$HOME/.local/bin' >> $GITHUB_PATH

      - name: Show platform & style
        run: |
          echo '════════════════════════════════════════'
          echo '📱 PLATFORM: ${{ inputs.platform }}'
          echo '🎨 STYLE:    ${{ inputs.style }}'
          echo '════════════════════════════════════════'
          node -e "require('./scripts/platforms.js').listPlatforms();"
          echo ''
          node -e "require('./scripts/styles.js').listStyles();"

      - name: Install yt-dlp (universal downloader)
        run: |
          python3 -m pip install --upgrade --quiet yt-dlp
          yt-dlp --version

      - name: Download video (auto-detect source)
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: node scripts/download.js

      - name: Convert video (single-pass + style)
        env:
          PLATFORM: ${{ inputs.platform }}
          STYLE: ${{ inputs.style }}
        run: node scripts/convert.js

      - name: Get output info
        id: output-info
        run: |
          OUTPUT_FILE=$(cat output/info.txt)
          PLATFORM_FILE=$(cat output/platform.txt)
          STYLE_FILE=$(cat output/style.txt 2>/dev/null || echo "clean-modern")
          FILENAME=$(basename "$OUTPUT_FILE")
          SIZE=$(stat -c %s "$OUTPUT_FILE")
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE / 1024 / 1024}")
          echo "file_name=$FILENAME" >> $GITHUB_OUTPUT
          echo "file_size=$SIZE_MB" >> $GITHUB_OUTPUT
          echo "platform=$PLATFORM_FILE" >> $GITHUB_OUTPUT
          echo "style=$STYLE_FILE" >> $GITHUB_OUTPUT

      - name: Validate output size
        env:
          SIZE_MB: ${{ steps.output-info.outputs.file_size }}
          PLATFORM: ${{ inputs.platform }}
          STRICT: ${{ inputs.strict_size_check }}
        run: |
          MAX_MB=$(node -e "console.log(require('./scripts/platforms.js').getPlatform(process.env.PLATFORM).maxSizeMB)")
          echo "📊 Size: ${SIZE_MB} MB / Max: ${MAX_MB} MB"
          if awk "BEGIN {exit !($SIZE_MB > $MAX_MB)}"; then
            echo "⚠️  Size melebihi limit"
            if [ "$STRICT" = "true" ]; then
              echo "❌ Strict mode ON — abort"
              exit 1
            fi
            echo "✅ Lanjut upload (strict OFF)"
          else
            echo "✅ Size OK"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "Video ${{ inputs.platform }} - ${{ inputs.style }} - ${{ inputs.release_tag }}"
          body: |
            ## 🎬 Video Converted

            | Field | Value |
            |-------|-------|
            | **Platform** | `${{ inputs.platform }}` |
            | **Style** | `${{ inputs.style }}` |
            | **Source** | ${{ inputs.video_url }} |
            | **File Size** | ${{ steps.output-info.outputs.file_size }} MB |

            ### 📥 Download
            Klik file di bawah untuk download video.
          files: output/*.mp4
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## 🎬 Conversion Summary"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Platform | **${{ inputs.platform }}** |"
            echo "| Style | **${{ inputs.style }}** |"
            echo "| File | **${{ steps.output-info.outputs.file_name }}** |"
            echo "| Size | ${{ steps.output-info.outputs.file_size }} MB |"
            echo "| Cache FFmpeg | ${{ steps.cache-ffmpeg.outputs.cache-hit }} |"
          } >> $GITHUB_STEP_SUMMARY
