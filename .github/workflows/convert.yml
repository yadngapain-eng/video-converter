name: Convert Video to 9:16

on:
  workflow_dispatch:
    inputs:
      gdrive_link:
        description: 'Google Drive link'
        required: true
        type: string
      release_tag:
        description: 'Release tag (contoh: v1)'
        required: true
        default: 'v1'
        type: string
      blur_strength:
        description: 'Blur strength (5-80, low = lebih aesthetic)'
        required: false
        default: '15'
        type: string
      brightness:
        description: 'Brightness (0.2-1.0, high = terang)'
        required: false
        default: '0.7'
        type: string
      saturation:
        description: 'Saturation (0.0-2.0, high = warna vivid)'
        required: false
        default: '0.85'
        type: string
      video_scale:
        description: 'Video scale (0.5-0.95)'
        required: false
        default: '0.75'
        type: string

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    name: Convert Video

    steps:
      # ============================================
      # CHECKOUT
      # ============================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================
      # SETUP NODE.JS
      # ============================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ============================================
      # CACHE STATIC FFMPEG
      # Pakai static binary (single file, no deps)
      # ============================================
      - name: Cache static FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/ffmpeg
            ~/.local/bin/ffprobe
          key: static-ffmpeg-${{ runner.os }}-v6

      # ============================================
      # DOWNLOAD FFMPEG (HANYA KALAU CACHE MISS)
      # ============================================
      - name: Download static FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          echo '⚡ FFmpeg cache MISS - downloading static binary...'
          mkdir -p ~/.local/bin
          cd /tmp
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar xf ffmpeg-release-amd64-static.tar.xz
          mv ffmpeg-*-amd64-static/ffmpeg ~/.local/bin/
          mv ffmpeg-*-amd64-static/ffprobe ~/.local/bin/
          chmod +x ~/.local/bin/ffmpeg ~/.local/bin/ffprobe
          echo '✅ FFmpeg downloaded to ~/.local/bin'
          ~/.local/bin/ffmpeg -version | head -1

      - name: Use cached FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit == 'true'
        run: |
          echo '✅ FFmpeg cache HIT - skip download!'
          ~/.local/bin/ffmpeg -version | head -1

      # ============================================
      # ADD FFMPEG TO PATH
      # ============================================
      - name: Add FFmpeg to PATH
        run: |
          echo '$HOME/.local/bin' >> $GITHUB_PATH
          which ffmpeg || true
          ffmpeg -version | head -1

      # ============================================
      # CACHE NODE MODULES
      # ============================================
      - name: Cache Node modules
        id: cache-node
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json') }}

      # ============================================
      # NPM INSTALL (HANYA KALAU CACHE MISS)
      # ============================================
      - name: Install Node dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: |
          echo '⚡ Node modules cache MISS - installing...'
          npm install --no-audit --no-fund --no-package-lock

      - name: Verify Node modules
        if: steps.cache-node.outputs.cache-hit == 'true'
        run: |
          echo '✅ Node modules cache HIT - skip install!'

      # ============================================
      # DOWNLOAD VIDEO
      # ============================================
      - name: Download video from Google Drive
        env:
          GDRIVE_LINK: ${{ inputs.gdrive_link }}
        run: node scripts/download.js

      # ============================================
      # CONVERT VIDEO
      # ============================================
      - name: Convert video to 9:16
        env:
          BLUR_STRENGTH: ${{ inputs.blur_strength }}
          BRIGHTNESS: ${{ inputs.brightness }}
          SATURATION: ${{ inputs.saturation }}
          VIDEO_SCALE: ${{ inputs.video_scale }}
        run: node scripts/convert.js

      # ============================================
      # GET OUTPUT INFO
      # ============================================
      - name: Get output info
        id: output-info
        run: |
          OUTPUT_FILE=$(cat output/info.txt)
          FILENAME=$(basename "$OUTPUT_FILE")
          SIZE=$(stat -c %s "$OUTPUT_FILE")
          SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
          echo "file_name=$FILENAME" >> $GITHUB_OUTPUT
          echo "file_size=$SIZE_MB" >> $GITHUB_OUTPUT

      # ============================================
      # CREATE RELEASE
      # ============================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "Video Converted - ${{ inputs.release_tag }}"
          body: |
            ## Video Converted to 9:16

            Source: ${{ inputs.gdrive_link }}
            Blur: ${{ inputs.blur_strength }}
            Video Scale: ${{ inputs.video_scale }}
            File Size: ${{ steps.output-info.outputs.file_size }} MB

            ### Download
            Klik file di bawah untuk download video.
          files: output/*.mp4
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================
      # SUMMARY
      # ============================================
      - name: Summary
        run: |
          echo "## Conversion Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**File:** ${{ steps.output-info.outputs.file_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** ${{ steps.output-info.outputs.file_size }} MB" >> $GITHUB_STEP_SUMMARY
          echo "**FFmpeg cache:** ${{ steps.cache-ffmpeg.outputs.cache-hit }}" >> $GITHUB_STEP_SUMMARY
          echo "**Node cache:** ${{ steps.cache-node.outputs.cache-hit }}" >> $GITHUB_STEP_SUMMARY